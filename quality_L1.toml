[[criterion]]
name="项目结构探索"
description ="[Implicit]使用 Glob 等工具扫描项目根目录和 src/ 目录，获取完整的文件与目录树，识别所有关键配置文件和源码文件的位置,“
type = "likert"
points = 5
weight = 1
score =3
rationale ="在撰写任何文档之前，必须先建立项目的完整地图，明确哪些文件存在、目录如何组织，这是后续所有分析步骤的基础"

[[criterion]]
name = "配置文件阅读"
description = "[Implicit] 阅读 package.json、vue.config.js、babel.config.js、.env.*、.eslintrc.js、jest.config.js等根目录配置文件，提取脚本命令、依赖列表、构建参数和环境变量"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "配置文件定义了开发环境要求、可用脚本、依赖关系和运行时行为，是理解项目怎么运行和打包发布的核心依据"

[[criterion]]
name = "核心源码阅读"
description = "[Explicit] 阅读 main.js、permission.js、router/index.js、store/、utils/request.js、utils/auth.js、layout/、api/等关键源码文件，理解应用初始化流程、状态管理、路由守卫、请求封装和布局结构"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "仅靠配置文件无法理解项目内部的运作机制；阅读源码才能准确描述每个目录和文件的实际用途，以及各模块之间的协作关系"

[[criterion]]
name = "依赖分析"
description = "[Implicit]逐一分析 package.json 中 dependencies 和 devDependencies的每个包，明确其版本号、功能和在项目中的具体用途（如 svg-sprite-loader 用于图标雪碧图、nprogress 用于路由进度条）"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "用户明确要求了解每个包是什么用途，需要结合源码中的实际引用场景进行说明，而非仅列出包名，这需要将步骤 2和步骤 3 的信息交叉验证"

[[criterion]]
name = "文档结构设计"
description = "[Explicit]根据用户提出的三个核心需求（开发环境、项目结构/包用途、运行与打包），设计文档的章节大纲、信息层次和阅读顺序，确保逻辑连贯、便于检索"
type = "likert"
points = 5
weight = 1.0
score = 3
rationale = "文档的价值取决于组织结构是否合理；面向二次开发者的文档需要按从环境搭建到深入理解再到实际操作的渐进路径编排，否则即使内容正确也难以高效使用"

[[criterion]]
name = "文档内容撰写"
description = "[Implicit] 基于前4步收集的信息，按照设计好的结构撰写完整文档，包含详细的说明文字、对照表格、代码片段、流程图（如权限控制流程）、Nginx部署配置参考和二次开发操作指引"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "将分析结果转化为开发者可直接参考的操作文档是最终交付物，需要使用表格提高可读性、使用代码块提供可复制的示例、使用流程图说明复杂逻辑"

[[criterion]]
name = "完整性与准确性校验"
description = "[Implicit] 将完成的文档与用户的原始需求逐项对照：是否覆盖了开发环境要求、项目结构说明、每个包的用途、运行方式、打包发布流程，检查是否有遗漏或与实际代码不符之处"
type = "likert"
points = 5
weight = 1.0
score = 4
rationale = "确保文档真正满足用户需求而非自说自话；验证文档中的路径、命令、配置是否与项目实际一致，避免出现因过时或臆测导致的错误信息"
